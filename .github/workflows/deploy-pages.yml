name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Bouton « Publier le site » de l'administration (fonction Supabase « publier »)
  repository_dispatch:
    types: [nataliia-publier]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      # Contenus publiés depuis l'administration (Supabase), puis génération du site.
      # URL du projet et clé publishable : publiques par conception (la sécurité repose sur
      # les règles d'accès de la base). Les variables de dépôt, si elles existent, priment.
      # Ne JAMAIS mettre ici la clé secrète (sb_secret_...).
      - name: Construire le site
        working-directory: site
        env:
          SUPABASE_URL: ${{ vars.NR_SUPABASE_URL || 'https://uguyaabdkxcdhlzgnaai.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.NR_SUPABASE_ANON_KEY || 'sb_publishable_o79qTWfOhw7f3OYHnXuSIw_TUciAjzM' }}
          NR_TURNSTILE_SITE_KEY: ${{ vars.NR_TURNSTILE_SITE_KEY }}
        run: |
          node fetch-content.mjs
          node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
